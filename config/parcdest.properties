# Configuracao do componente Parceiro Destinatario / Portal de Importacao de XML.
#
# Destino: <Repositorio de Arquivos>/personalizacao/parcdest/parcdest.properties
# Relido do disco a cada 60s. Nao exige restart do servico.
# Arquivo ausente = defaults seguros (tracing ON, workaround OFF).

# Registra os eventos da TGFCAB no log. Nao altera dado.
tracing=ON

# FASE 2: preenche CODPARCDEST no beforeInsert.
workaround=ON

# TOPs no escopo, separadas por virgula.
tops=1419

# Quando o xPed nao resolve o pedido:
#   ANTIGO  pedido pendente mais antigo do parceiro (regra do proprio Portal)
#   UNICO   so atua se os pendentes convergirem para o mesmo destinatario
#   OFF     nenhuma inferencia; so TGFIXN.CODPARCDEST e xPed
fallback=ANTIGO

# Campos extras da TGFCAB a registrar no log, separados por virgula.
camposExtras=CHAVENFE,STATUSNOTA,PENDENTE,TIPMOV,CODEMP
