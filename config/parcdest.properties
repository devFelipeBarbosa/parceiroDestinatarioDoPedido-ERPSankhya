# Configuracao do componente Parceiro Destinatario / Portal de Importacao de XML.
#
# Destino: <Repositorio de Arquivos>/personalizacao/parcdest/parcdest.properties
# Relido do disco a cada 60s. Nao exige restart do servico.
# Arquivo ausente = defaults seguros (tracing ON, workaround OFF).

# Registra os eventos da TGFCAB no log. Nao altera dado.
tracing=ON

# FASE 2: preenche CODPARCDEST no beforeInsert.
workaround=ON

# TOPs no escopo, separadas por virgula.
tops=1419

# Ultima linha da cadeia, quando nem o xPed nem o grupo <entrega> resolvem.
# E o unico ponto do componente que infere; as demais origens sao declaradas no documento.
#   UNICO   so atua se todos os pendentes do parceiro convergirem para o mesmo
#           destinatario. Havendo divergencia, nao grava. (default)
#   ANTIGO  pedido pendente mais antigo do parceiro, igual ao "Ligar pedidos mais
#           antigos" do Portal. Grava mesmo sob ambiguidade.
#   OFF     nenhuma inferencia; so TGFIXN.CODPARCDEST, xPed e <entrega>.
# Valor irreconhecivel cai em UNICO.
fallback=UNICO

# Campos extras da TGFCAB a registrar no log, separados por virgula.
camposExtras=CHAVENFE,STATUSNOTA,PENDENTE,TIPMOV,CODEMP
